# OPTIONAL deploy route: deploys main to Cloudflare Pages from GitHub Actions.
#
# Use this ONLY if you do not connect the repo through Cloudflare's own Git integration (never both, or every
# push deploys twice). It needs no access from Cloudflare to GitHub: the repo owner adds two secrets under
# GitHub → Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN   (Cloudflare → My Profile → API Tokens → template "Edit Cloudflare Workers"
#                           or a custom token with "Account · Cloudflare Pages · Edit")
#   CLOUDFLARE_ACCOUNT_ID  (Cloudflare dashboard → Workers & Pages → right sidebar)
# The Pages project (name below) must exist first: `npx wrangler pages project create makeitlive`.
# Without the secrets this workflow does nothing.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Skip (Cloudflare secrets not set)
        if: env.CF_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so nothing is deployed from GitHub Actions."
      - uses: actions/checkout@v4
        if: env.CF_TOKEN != ''
      - name: Collect public files into dist/
        if: env.CF_TOKEN != ''
        run: sh scripts/build-cloudflare.sh
      - name: Deploy
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=makeitlive --branch=main
